CancelShortcutCapture = "Отмена"
Compatibility = "Совместимость"
MeridianSupport = "Поддержка ввода Meridian UI"
MeridianSupportToolTip = "Когда интерфейс Meridian (рендеринг CEF, например ателье) получает фокус, IME включается автоматически, а введённый текст отправляется прямо в его веб-поля. Без MeridianUI.dll не действует. Изменения вступают в силу после перезапуска игры."
PrismaAvoidance = "Режим уступки Prisma UI"
PrismaAvoidanceToolTip = "Интерфейсы Prisma (PMCM, Outfit Wheeler и др.) захватывают ввод через собственную привязку IME. Когда включено, SimpleIME берёт на себя ввод текста, пока представление Prisma в фокусе: показывается собственное окно кандидатов, а подтверждённый текст передаётся в представление через символьный поток окна игры; при выключении IME клавиатура возвращается нативному конвейеру Prisma. Если публичный V1-интерфейс PrismaUI недоступен, SimpleIME полностью уступает (нативный ввод, без окна кандидатов). Изменения вступают в силу после перезапуска игры."
SkseMenuFrameworkSupport = "Поддержка ввода SKSE Menu Framework"
SkseMenuFrameworkSupportToolTip = "Когда текстовое поле SKSE Menu Framework (меню на ImGui) в фокусе, IME включается автоматически, а введённый текст вставляется в поле. Требуется SKSEMenuFramework.dll 3.7 или новее. Изменения вступают в силу после перезапуска игры."
ImguiSurfaceInput = "Поддержка нативных ImGui-интерфейсов"
ImguiSurfaceInputToolTip = "Некоторые меню модов (Tailor 3.x и подобные) рисуются собственным контекстом Dear ImGui, а не Scaleform — поля для записи нет. Если включено, подтверждённый текст передаётся через очередь ввода самого движка. Когда меню объявляет, что само обрабатывает внешнюю композицию (SimpleIME.ImeAware), отмена бэкспейсами не выполняется. Действует только когда текстовая цель — не поле Scaleform."
PauseGameWhileSettingsOpen = "Ставить игру на паузу, пока открыто окно настроек"
PauseGameWhileSettingsOpenToolTip = "По умолчанию выключено. Если включить, игра ставится на паузу только пока окно настроек SimpleIME на экране и возобновляется при закрытии (изменения применяются сразу). Некоторые меню модов воспринимают счётчик паузы RE::UI как сигнал «моё меню закрыли» (в том числе нативный ImGui-интерфейс Tailor 3.x); пока такой интерфейс владеет вводом текста (поле SKSE Menu Framework и т. п.), SimpleIME уступает паузу, чтобы не закрыть его."

