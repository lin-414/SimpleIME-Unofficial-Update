<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>SimpleIME Cover</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0C0C0E; }
  body { width: 1280px; height: 720px; overflow: hidden; }

  .stage {
    position: relative;
    width: 1280px;
    height: 720px;
    background: #121214;
    overflow: hidden;
    font-family: 'Segoe UI', 'Microsoft YaHei UI', sans-serif;
  }

  .scene { position: absolute; inset: 0; z-index: 1; }

  .glow-title {
    position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
    width: 940px; height: 430px; z-index: 2;
    background: radial-gradient(ellipse at center, rgba(77,122,109,0.13) 0%, rgba(77,122,109,0) 65%);
  }
  .glow-bar {
    position: absolute; top: 300px; left: 50%; transform: translateX(-50%);
    width: 860px; height: 300px; z-index: 2;
    background: radial-gradient(ellipse at center, rgba(77,122,109,0.15) 0%, rgba(77,122,109,0) 65%);
  }
  .vignette {
    position: absolute; inset: 0; z-index: 3;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 14%),
      linear-gradient(0deg, rgba(0,0,0,0.40) 0%, rgba(0,0,0,0) 22%),
      radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.42) 100%);
  }

  .content {
    position: relative; z-index: 5;
    display: flex; flex-direction: column; align-items: center;
    padding-top: 66px;
  }

  .eyebrow {
    font-family: 'Bahnschrift', 'Segoe UI', sans-serif;
    font-size: 13px; font-weight: 400;
    letter-spacing: 4px; padding-left: 4px;
    color: #B8B2A7;
    border: 1px solid rgba(58,61,72,0.9);
    background: rgba(26,27,31,0.55);
    border-radius: 999px;
    padding: 9px 20px 9px 24px;
  }

  h1 {
    margin-top: 38px;
    font-family: 'Palatino Linotype', 'Constantia', Georgia, serif;
    font-size: 100px; font-weight: 700;
    letter-spacing: 0.045em; padding-left: 0.045em;
    color: #ECE0C8;
    text-shadow: 0 3px 24px rgba(0,0,0,0.55), 0 0 80px rgba(77,122,109,0.18);
  }
  h1 .accent { color: #6E9685; }

  .edition {
    margin-top: 20px;
    display: inline-flex; align-items: center; gap: 10px;
    font-family: 'Bahnschrift', 'Microsoft YaHei UI', 'Microsoft YaHei', sans-serif;
    font-size: 14px; font-weight: 400;
    letter-spacing: 4px; padding-left: 4px;
    color: #BFD3C6;
    background: rgba(36,53,47,0.85);
    border: 1px solid rgba(110,150,133,0.45);
    border-radius: 999px;
    padding: 9px 22px 9px 25px;
  }
  .edition .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #6E9685;
    box-shadow: 0 0 8px rgba(110,150,133,0.9);
  }

  .sub-en {
    margin-top: 14px;
    font-size: 15px; font-weight: 400;
    letter-spacing: 0.6px;
    color: #B8B2A7;
  }

  .runes {
    margin-top: 26px;
    display: flex; align-items: center; gap: 16px;
  }
  .runes .line { width: 58px; height: 1px; background: linear-gradient(90deg, rgba(58,61,72,0) 0%, rgba(58,61,72,0.95) 100%); }
  .runes .line.r { transform: scaleX(-1); }
  .runes .glyphs {
    font-family: 'Segoe UI Historic', sans-serif;
    font-size: 14px; letter-spacing: 11px; padding-left: 11px;
    color: rgba(110,150,133,0.72);
  }

  /* ---- candidate window mock (matches ImeWindow::DrawCandidates styling) ---- */
  .candidate {
    margin-top: 42px;
    background: #1A1B1F;
    border: 1px solid #3A3D48;
    border-radius: 10px;
    padding: 16px 22px 15px;
    box-shadow: 0 22px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(236,224,200,0.05);
  }
  .comp {
    font-size: 24px;
    color: #ECE0C8;
    letter-spacing: 1px;
  }
  .comp .clause {
    box-shadow: 0 2px 0 #6E9685;
    padding-bottom: 2px;
  }
  .comp .caret {
    display: inline-block; width: 2px; height: 25px;
    background: #ECE0C8; opacity: 0.9;
    margin-left: 4px; vertical-align: -4px;
  }
  .cand-divider { height: 1px; background: #2E3038; margin: 13px -22px; }
  .cands { display: flex; gap: 11px; align-items: center; }
  .chip {
    display: flex; align-items: baseline;
    padding: 5px 9px; border-radius: 6px;
    font-size: 23px; line-height: 29px;
  }
  .chip.sel { background: #4D7A6D; }
  .chip .num { margin-right: 6px; }
  .chip .num, .chip .word { font-family: 'Microsoft YaHei UI', 'Segoe UI', sans-serif; }
  .chip .num { color: #B8B2A7; }
  .chip .word { color: #ECE0C8; }
  .chip.sel .num, .chip.sel .word { color: #FCFBF9; }
</style>
</head>
<body>
<div class="stage">

  <svg class="scene" viewBox="0 0 1280 720" width="1280" height="720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="moonHalo" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ECE0C8" stop-opacity="0.16"/>
        <stop offset="30%" stop-color="#ECE0C8" stop-opacity="0.08"/>
        <stop offset="70%" stop-color="#ECE0C8" stop-opacity="0.02"/>
        <stop offset="100%" stop-color="#ECE0C8" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- moon: hazy glow orb, no hard edge -->
    <circle cx="1058" cy="128" r="150" fill="url(#moonHalo)"/>

    <!-- stars / drifting snow -->
    <g fill="#ECE0C8">
      <circle cx="86"  cy="96"  r="1.4" opacity="0.13"/>
      <circle cx="176" cy="188" r="1.1" opacity="0.09"/>
      <circle cx="252" cy="74"  r="1.6" opacity="0.15"/>
      <circle cx="338" cy="150" r="1.0" opacity="0.08"/>
      <circle cx="428" cy="96"  r="1.3" opacity="0.12"/>
      <circle cx="542" cy="58"  r="1.1" opacity="0.10"/>
      <circle cx="664" cy="112" r="1.5" opacity="0.14"/>
      <circle cx="770" cy="70"  r="1.0" opacity="0.08"/>
      <circle cx="878" cy="142" r="1.3" opacity="0.11"/>
      <circle cx="936" cy="242" r="1.1" opacity="0.09"/>
      <circle cx="1176" cy="96" r="1.3" opacity="0.11"/>
      <circle cx="1226" cy="210" r="1.1" opacity="0.08"/>
      <circle cx="64"  cy="300" r="1.2" opacity="0.09"/>
      <circle cx="150" cy="392" r="1.0" opacity="0.07"/>
      <circle cx="108" cy="506" r="1.4" opacity="0.11"/>
      <circle cx="236" cy="470" r="1.1" opacity="0.08"/>
      <circle cx="318" cy="530" r="1.3" opacity="0.10"/>
      <circle cx="452" cy="420" r="1.0" opacity="0.07"/>
      <circle cx="604" cy="560" r="1.2" opacity="0.09"/>
      <circle cx="836" cy="430" r="1.0" opacity="0.07"/>
      <circle cx="948" cy="510" r="1.3" opacity="0.10"/>
      <circle cx="1064" cy="386" r="1.1" opacity="0.08"/>
      <circle cx="1150" cy="470" r="1.4" opacity="0.11"/>
      <circle cx="1238" cy="330" r="1.0" opacity="0.07"/>
      <circle cx="700" cy="250" r="1.0" opacity="0.08"/>
      <circle cx="392" cy="250" r="1.1" opacity="0.08"/>
    </g>

    <!-- mountain ridges -->
    <path d="M0,540 L90,505 L170,532 L262,478 L342,524 L432,494 L522,534 L612,498 L702,540 L792,504 L882,534 L972,488 L1062,528 L1152,498 L1280,544 L1280,720 L0,720 Z" fill="#1C1D25"/>
    <path d="M0,592 L122,556 L242,586 L362,546 L472,580 L582,550 L702,590 L832,556 L952,590 L1082,556 L1280,596 L1280,720 L0,720 Z" fill="#171820"/>
    <path d="M0,652 L152,616 L302,646 L472,606 L642,648 L822,610 L992,650 L1152,620 L1280,656 L1280,720 L0,720 Z" fill="#121319"/>
    <path d="M0,540 L90,505 L170,532 L262,478 L342,524 L432,494 L522,534 L612,498 L702,540 L792,504 L882,534 L972,488 L1062,528 L1152,498 L1280,544" fill="none" stroke="#ECE0C8" stroke-opacity="0.08" stroke-width="1.5"/>
  </svg>

  <div class="glow-title"></div>
  <div class="glow-bar"></div>
  <div class="vignette"></div>

  <div class="content">
    <div class="eyebrow">SKYRIM SE / AE &nbsp;·&nbsp; SKSE PLUGIN</div>

    <h1>Simple<span class="accent">IME</span></h1>

    <div class="edition"><span class="dot"></span>非官方更新</div>

    <div class="sub-en">Native IME input for Skyrim SE / AE — console, every text field &amp; mod UIs</div>

    <div class="runes">
      <div class="line"></div>
      <div class="glyphs">ᛊᛁᛗᛈᛚᛖᛁᛗᛖ</div>
      <div class="line r"></div>
    </div>

    <div class="candidate">
      <div class="comp">SimpleIME<span class="caret"></span></div>
      <div class="cand-divider"></div>
      <div class="cands">
        <div class="chip sel"><span class="num">1</span><span class="word">你好</span></div>
        <div class="chip"><span class="num">2</span><span class="word">Hello</span></div>
        <div class="chip"><span class="num">3</span><span class="word">こんにちは</span></div>
        <div class="chip"><span class="num">4</span><span class="word">안녕</span></div>
        <div class="chip"><span class="num">5</span><span class="word">Hallo</span></div>
        <div class="chip"><span class="num">6</span><span class="word">Привет</span></div>
      </div>
    </div>

  </div>

</div>
</body>
</html>
